name: Weather Report Bot

on:
  schedule:
    # Hourly for the dashboard. GitHub runs scheduled jobs when it can
    # (lately every 2–3 h); off-the-hour minutes get picked up more reliably.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      post_now:
        description: "Post the report now, even outside the 6–11 AM / 5–10 PM windows"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: log the post, send nothing"
        type: boolean
        default: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      # ── Determine report period + whether to post social ──────────────────
      - name: Determine report period
        id: report_time
        run: |
          pixi run python -c "
          from datetime import datetime
          import pytz, os
          pt  = pytz.timezone('America/Los_Angeles')
          now = datetime.now(pt)
          h   = now.hour

          period = 'morning' if 6 <= h < 14 else 'evening'
          ts     = now.strftime('%-I:%M %p PT | %B %d, %Y')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'REPORT_PERIOD={period}\n')
              f.write(f'TIMESTAMP={ts}\n')

          print(f'Period: {period} | {ts}')
          "

      # ── Generate cards + JSON (every run) ─────────────────────────────────
      - name: Generate original chart
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          REPORT_PERIOD: ${{ steps.report_time.outputs.REPORT_PERIOD }}
          TIMESTAMP: ${{ steps.report_time.outputs.TIMESTAMP }}
        run: pixi run chart

      - name: Generate K5-style cards
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          REPORT_PERIOD: ${{ steps.report_time.outputs.REPORT_PERIOD }}
          TIMESTAMP: ${{ steps.report_time.outputs.TIMESTAMP }}
        run: |
          pixi run python -c "
          import os, sys
          sys.path.insert(0, 'src')
          from weather import get_weather_data
          from chart_k5 import create_k5_charts
          api_key = os.environ['OPENWEATHER_API_KEY']
          data    = get_weather_data(api_key)
          try:
              from weather import get_forecast_data
              forecast = get_forecast_data(api_key)
          except Exception as e:
              print(f'Forecast skipped: {e}')
              forecast = {}
          create_k5_charts(data, forecast_data=forecast,
                           report_period=os.environ.get('REPORT_PERIOD','morning'),
                           timestamp=os.environ.get('TIMESTAMP',''))
          "

      - name: Export JSON for dashboard
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          REPORT_PERIOD: ${{ steps.report_time.outputs.REPORT_PERIOD }}
          TIMESTAMP: ${{ steps.report_time.outputs.TIMESTAMP }}
        run: pixi run python src/export_json.py

      # ── Report post to Bluesky (and X), standing by ──────────────────────
      # Posts on the first run in each window (6–11 AM, 5–10 PM PT) that
      # hasn't posted yet. Fails once if a network starts refusing posts, so
      # GitHub sends an email; the networks don't block each other.
      # Off since October 2026: the live weather station page has the same
      # data, so the twice-daily post isn't needed. To turn it back on, set
      # the repo variable POST_REPORT to "on" (and POST_TO_X to "on" for X).
      - name: Post report
        id: social
        if: vars.POST_REPORT == 'on' || inputs.post_now
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          POST_TO_X: ${{ vars.POST_TO_X }}
          POST_NOW: ${{ inputs.post_now && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: pixi run social

      # ── Commit PNGs + JSON back to repo ───────────────────────────────────
      - name: Commit dashboard data, post state and log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true
          git add weather_data.json social_state.json logs/ 2>/dev/null || git add weather_data.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: update weather data [skip ci]"
          git push

      # ── Publish chart PNGs to a single-commit "charts" branch ─────────────
      # Committing the PNGs to main every hour kept every version forever and
      # grew the repo past 2 GB. The dashboard only reads weather_data.json;
      # the PNGs are for the README, which reads them from this branch.
      - name: Publish charts to the charts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls weather_*.png >/dev/null 2>&1 || { echo "No charts this run"; exit 0; }
          tmp=$(mktemp -d)
          cp weather_*.png "$tmp"/
          cd "$tmp"
          git init -q -b charts
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "charts: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" charts

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-charts
          path: |
            weather_report.png
            weather_report_k5.png
            weather_*.png
            weather_data.json
          retention-days: 7
